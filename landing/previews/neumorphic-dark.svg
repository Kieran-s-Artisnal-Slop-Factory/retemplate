      <feComposite in="b2" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="i2"/>
      <feFlood flood-color="#363b45" flood-opacity="0.9"/><feComposite in2="i2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="s1"/><feMergeNode in="s2"/></feMerge>
    </filter>
  </defs>
